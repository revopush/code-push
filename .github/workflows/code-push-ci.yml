name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege: CI only reads the repository contents.
permissions:
  contents: read

# Cancel superseded runs when a PR is updated, to save CI minutes.
# Pushes to master are never cancelled, so the default branch keeps a
# complete status history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check for merging into master (org-wide branch protection
  # matches on the job name "check").
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm

      # Fails if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
